name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Format check
        run: npm run format:check

      - name: Lint and typecheck (Oxlint + TypeScript 7)
        run: npm run lint

      - name: Unused code and dependencies (knip)
        run: npm run knip

      - name: Banned syntax (ast-grep)
        run: npm run ast-grep

      - name: Build
        run: npm run build

      - name: Verify manifest / versions.json consistency
        run: |
          manifest_version="$(node -p "require('./manifest.json').version")"
          min_app="$(node -p "require('./manifest.json').minAppVersion")"
          mapped="$(node -p "require('./versions.json')['$manifest_version'] ?? ''")"
          if [ "$mapped" != "$min_app" ]; then
            echo "::error::versions.json['$manifest_version'] is '$mapped', expected '$min_app'"
            exit 1
          fi
