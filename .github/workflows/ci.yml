name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: npm

      - run: npm ci

      - name: Typecheck and build
        run: npm run build

      - name: Verify manifest / versions.json consistency
        run: |
          manifest_version="$(node -p "require('./manifest.json').version")"
          min_app="$(node -p "require('./manifest.json').minAppVersion")"
          mapped="$(node -p "require('./versions.json')['$manifest_version'] ?? ''")"
          if [ "$mapped" != "$min_app" ]; then
            echo "::error::versions.json['$manifest_version'] is '$mapped', expected '$min_app'"
            exit 1
          fi
